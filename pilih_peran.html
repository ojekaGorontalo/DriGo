    /* ===== MODAL BASE64 (WAJIB + UPLOAD LANGSUNG) ===== */
    .base64-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .base64-modal-overlay.active {
      display: flex;
    }
    .base64-modal {
      background: white;
      border-radius: 24px;
      max-width: 90%;
      width: 400px;
      padding: 30px 25px 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .base64-modal h2 {
      color: #FF5722;
      margin-bottom: 12px;
      font-size: 22px;
    }
    .base64-modal p {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 18px;
    }
    .base64-modal .highlight {
      color: #FF9800;
      font-weight: 600;
    }
    .upload-area {
      margin: 15px 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .upload-area .photo-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #FF9800;
      background: #f0f0f0;
    }
    .upload-area .upload-btn {
      background: #FF9800;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-area .upload-btn:hover {
      background: #e68900;
    }
    .upload-area .upload-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .upload-status {
      font-size: 14px;
      color: #FF9800;
      font-weight: 500;
      min-height: 24px;
    }
    .btn-update {
      background: linear-gradient(135deg, #FF9800, #FF5722);
      color: white;
      border: none;
      padding: 14px 35px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      display: inline-block;
      text-decoration: none;
      margin-top: 10px;
      width: 100%;
    }
    .btn-update:hover {
      transform: translateY(-2px);
    }
    .btn-update:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body class="splash-active">

  <!-- SPLASH SCREEN -->
  <div id="splashScreen"></div>

  <!-- MODAL BASE64 (WAJIB – UPLOAD LANGSUNG DI SINI) -->
  <div id="base64Modal" class="base64-modal-overlay">
    <div class="base64-modal">
      <h2>📸 Perbarui Foto Profil</h2>
      <p>
        Harap Upload foto Anda kembali. <span class="highlight">Base64</span> tidak kami terima. Kami akan memverifikasi foto Anda, silakan beri foto asli sesuai KTP.
        <br><br>
        Harap perbarui Foto Anda.
      </p>
      <div class="upload-area">
        <img id="photoPreview" class="photo-preview" src="https://www.gravatar.com/avatar/?d=mp" alt="Preview">
        <input type="file" id="photoFile" accept="image/*" style="display: none;">
        <button type="button" class="upload-btn" id="uploadPhotoBtn">📤 Pilih Foto</button>
        <div id="uploadStatus" class="upload-status"></div>
      </div>
      <button class="btn-update" id="submitUploadBtn" disabled>Upload & Perbarui</button>
    </div>
  </div>

  <script>
    // ================= FIREBASE CONFIG =================
    const firebaseConfig = {
      apiKey: "AIzaSyCD0pgeZio-LdKqYDtWxcdXcZwyL4ngYQI",
      authDomain: "jego-35a2b.firebaseapp.com",
      databaseURL: "https://jego-35a2b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "jego-35a2b",
      storageBucket: "jego-35a2b.firebasestorage.app",
      messagingSenderId: "600037007040",
      appId: "1:600037007040:web:ac3243ad9b472647ffd725"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    // ================= DOM REFS =================
    const modalOverlay = document.getElementById('base64Modal');
    const photoFile = document.getElementById('photoFile');
    const photoPreview = document.getElementById('photoPreview');
    const uploadStatus = document.getElementById('uploadStatus');
    const uploadBtn = document.getElementById('uploadPhotoBtn');
    const submitBtn = document.getElementById('submitUploadBtn');

    let selectedFile = null;
    let isUploading = false;

    // ================= HELPER FUNCTIONS =================
    function isValidDriverSession(session) {
      if (!session || typeof session !== 'object') return false;
      return !!(session.uid) && session.status === 'active';
    }

    function isValidCustomerSession(session) {
      if (!session || typeof session !== 'object') return false;
      return !!(session.userId || session.uid) && !!session.email;
    }

    function isBase64Photo(url) {
      if (!url) return false;
      if (url.startsWith('data:image')) return true;
      if (url.length > 2000) return true;
      return false;
    }

    function getDriverSession() {
      try {
        const raw = localStorage.getItem('jego_logged_in_driver');
        if (raw) return JSON.parse(raw);
      } catch(e) { /* ignore */ }
      return null;
    }

    function getCustomerSession() {
      try {
        const raw = localStorage.getItem('jego_logged_in_user');
        if (raw) return JSON.parse(raw);
      } catch(e) { /* ignore */ }
      return null;
    }

    // ================= FUNGSI UPLOAD KE IMGBB =================
    async function getImgBBKey() {
      try {
        const snap = await database.ref('data-jego/imgBBapiKey').once('value');
        return snap.val();
      } catch(e) { return null; }
    }

    async function uploadToImgBB(file) {
      const apiKey = await getImgBBKey();
      if (!apiKey) throw new Error('API Key imgBB tidak ditemukan. Hubungi admin.');
      const formData = new FormData();
      formData.append('key', apiKey);
      formData.append('image', file);
      const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
      const result = await response.json();
      if (!result.success) throw new Error(result.error?.message || 'Gagal upload ke imgBB');
      return result.data.url;
    }

    // ================= PROSES UPLOAD & UPDATE =================
    async function processUpload(file) {
      const driverSession = getDriverSession();
      if (!driverSession || !driverSession.uid) {
        uploadStatus.textContent = '❌ Sesi tidak valid. Login ulang.';
        return;
      }
      const uid = driverSession.uid;

      isUploading = true;
      submitBtn.disabled = true;
      uploadBtn.disabled = true;
      uploadStatus.textContent = '⏳ Mengupload ke imgBB...';

      try {
        const photoURL = await uploadToImgBB(file);
        console.log('📸 Foto berhasil diupload:', photoURL);

        // Update Firebase
        await database.ref(`drivers/${uid}/photoURL`).set(photoURL);

        // Update LocalStorage
        let localData = JSON.parse(localStorage.getItem('jego_logged_in_driver') || '{}');
        localData.photoURL = photoURL;
        localStorage.setItem('jego_logged_in_driver', JSON.stringify(localData));

        uploadStatus.textContent = '✅ Foto berhasil diperbarui!';

        // Tutup modal dan redirect
        setTimeout(() => {
          modalOverlay.classList.remove('active');
          // Redirect sesuai peran
          const updatedDriver = getDriverSession();
          if (updatedDriver && isValidDriverSession(updatedDriver)) {
            window.location.href = 'index.html';
          } else {
            window.location.href = 'customer/loginUser.html';
          }
        }, 1500);

      } catch (err) {
        console.error(err);
        uploadStatus.textContent = '❌ Gagal: ' + err.message;
        submitBtn.disabled = false;
        uploadBtn.disabled = false;
        isUploading = false;
      }
    }

    // ================= EVENT LISTENER =================
    // Pilih file
    uploadBtn.addEventListener('click', () => {
      if (isUploading) return;
      photoFile.click();
    });

    photoFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('📸 Hanya file gambar yang diperbolehkan!');
        return;
      }
      // Preview
      const reader = new FileReader();
      reader.onload = (ev) => { photoPreview.src = ev.target.result; };
      reader.readAsDataURL(file);
      selectedFile = file;
      uploadStatus.textContent = '📷 Foto siap diupload';
      submitBtn.disabled = false;
    });

    // Submit upload
    submitBtn.addEventListener('click', () => {
      if (!selectedFile || isUploading) return;
      processUpload(selectedFile);
    });

    // ================= FUNGSI TAMPILKAN MODAL =================
    function showBase64Modal() {
      modalOverlay.classList.add('active');
      document.getElementById('splashScreen').classList.add('hide-splash');
      document.body.classList.remove('splash-active');
    }

    function redirectTo(redirectUrl) {
      const splash = document.getElementById('splashScreen');
      splash.classList.add('hide-splash');
      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 600);
    }

    // ================= CEK DAN REDIRECT =================
    function checkAndRedirect() {
      let driverSession = getDriverSession();
      let customerSession = getCustomerSession();

      if (!driverSession && !customerSession) {
        redirectTo('peran.html');
        return;
      }

      if (driverSession && isValidDriverSession(driverSession)) {
        const uid = driverSession.uid;
        database.ref(`drivers/${uid}/photoURL`).once('value')
          .then((snap) => {
            const photoURL = snap.val();
            if (isBase64Photo(photoURL)) {
              showBase64Modal();
            } else {
              redirectTo('index.html');
            }
          })
          .catch(() => {
            if (isBase64Photo(driverSession.photoURL)) {
              showBase64Modal();
            } else {
              redirectTo('index.html');
            }
          });
        return;
      }

      if (customerSession && isValidCustomerSession(customerSession)) {
        redirectTo('customer/jenis_kenderaan.html');
        return;
      }

      redirectTo('peran.html');
    }

    // ================= EKSEKUSI =================
    setTimeout(() => {
      checkAndRedirect();
    }, 3000);

    // Timeout fallback
    setTimeout(() => {
      const modalActive = modalOverlay.classList.contains('active');
      if (!modalActive) {
        const splash = document.getElementById('splashScreen');
        if (!splash.classList.contains('hide-splash')) {
          splash.classList.add('hide-splash');
          setTimeout(() => {
            window.location.href = 'customer/loginUser.html';
          }, 600);
        }
      }
    }, 5000);
  </script>
</body>
</html>
