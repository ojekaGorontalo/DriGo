    // ========== LOGGER HELPER ==========
    function logStep(step, msg, data = null) {
        const timestamp = new Date().toLocaleTimeString('id-ID');

        } else {

    // ========== DARK MODE TOGGLE ==========
    function initDarkMode() {
        logStep('🌙', '[initDarkMode] mulai');
        const darkModeToggle = document.getElementById('darkModeToggle');
        if (!darkModeToggle) {
            logStep('🌙', '[initDarkMode] ❌ tombol darkModeToggle TIDAK DITEMUKAN');
            return;
        }
        const isDarkMode = localStorage.getItem('jego_dark_mode') === 'true';
        logStep('🌙', `[initDarkMode] dark mode sebelumnya: ${isDarkMode}`);
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️';
        } else {
            document.body.classList.remove('dark-mode');
            darkModeToggle.textContent = '🌙';
        }
        darkModeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('jego_dark_mode', isDark);
            darkModeToggle.textContent = isDark ? '☀️' : '🌙';
            logStep('🌙', `[initDarkMode] toggle → ${isDark ? 'DARK' : 'LIGHT'}`);
        });
        logStep('🌙', '[initDarkMode] ✅ selesai');
    }

    // ========== CEK STATUS NOTIFIKASI (FCM) ==========
    async function checkNotificationStatus() {
        logStep('🔔', '[checkNotificationStatus] mulai');
        if (!currentUser || !currentUser.uid) {
            showCustomPopup(
                'Login Diperlukan',
                'Silakan login terlebih dahulu untuk melihat status notifikasi.',
                'warning',
                '⚠️'
            );
            return;
        }

        try {
            if (!firebaseDatabase) await initializeFirebase();
            const snapshot = await firebaseDatabase.ref(`users/${currentUser.uid}/fcmTokens`).once('value');
            const tokens = snapshot.val();

            if (tokens && Object.keys(tokens).length > 0) {
                showCustomPopup(
                    'Notifikasi Aktif ✅',
                    'Anda akan menerima notifikasi terbaru dari JeGo.',
                    'success',
                    '✅'
                );
            } else {
                showCustomPopup(
                    'Notifikasi Belum Aktif ⚠️',
                    'Silakan aktifkan notifikasi di pengaturan aplikasi Anda.',
                    'warning',
                    '⚠️'
                );
            }
        } catch (error) {
            console.error('Gagal cek status notifikasi:', error);
            showCustomPopup(
                'Gagal Memeriksa ❌',
                'Terjadi kesalahan. Silakan coba lagi nanti.',
                'error',
                '❌'
            );
        }

    // ========== CUSTOM POPUP ==========
    function showCustomPopup(title, message, type = 'info', icon = '🔔') {
        const overlay = document.getElementById('customPopup');
        const content = document.getElementById('customPopupContent');
        const iconEl = document.getElementById('popupIcon');
        const titleEl = document.getElementById('popupTitle');
        const msgEl = document.getElementById('popupMessage');
        const btn = document.getElementById('popupBtn');

        const iconMap = {
            success: '✅',
            warning: '⚠️',
            error: '❌',
            info: 'ℹ️'
        };
        
        iconEl.textContent = icon || iconMap[type] || '🔔';
        titleEl.textContent = title || 'Notifikasi';
        msgEl.textContent = message || '';

        content.className = 'custom-popup';
        content.classList.add(type);

        overlay.classList.add('active');

        btn.onclick = function() {
            overlay.classList.remove('active');
        };

        overlay.onclick = function(e) {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        };
    }

    async function cekOrderAktifDanRedirect() {
        logStep('🔍', '[cekOrderAktifDanRedirect] mulai');
        const orderId = localStorage.getItem('current_order_id');
        if (!orderId) {
            logStep('🔍', '[cekOrderAktifDanRedirect] tidak ada order aktif');
            return false;
        }
        try {
            const snap = await firebaseDatabase.ref(`orders/${orderId}`).once('value');
            const order = snap.val();
            if (!order) {
                localStorage.removeItem('current_order_id');
                return false;
            }
            if (order.status === 'waiting') {
                window.location.href = 'rute_kurir.html';
                return true;
            }
            const statusAktif = ['accepted', 'on_the_way', 'arrived', 'on_trip'];
            if (statusAktif.includes(order.status)) {
                window.location.href = 'tracking_customer.html';
                return true;
            } else {
                localStorage.removeItem('current_order_id');
                return false;
            }
        } catch (err) {
            console.error('Cek order error:', err);
            return false;
        }
    }

                logStep('🔥', '[initializeFirebase] firebase.initializeApp() ✅');

            firebaseDatabase = firebase.database();
            firebaseAuth = firebase.auth();
            logStep('🔥', '[initializeFirebase] firebaseDatabase:', firebaseDatabase ? '✅ OK' : '❌ NULL');
            logStep('🔥', '[initializeFirebase] firebaseAuth:', firebaseAuth ? '✅ OK' : '❌ NULL');
            await firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
            logStep('🔥', '[initializeFirebase] ✅ selesai');
            return true;
        } catch (error) {
            console.error('❌ [initializeFirebase] ERROR:', error);
            return false;
        }
    }

    function waitForFirebaseAuth(maxWait = 10000) {
        return new Promise((resolve) => {
            if (!firebaseAuth) {
                resolve(null);
                return;
            }
            if (firebaseAuth.currentUser) {
                resolve(firebaseAuth.currentUser);
                return;
            }
            let resolved = false;
            const unsubscribe = firebaseAuth.onAuthStateChanged((user) => {
                if (!resolved) {
                    resolved = true;
                    unsubscribe();
                    resolve(user);
                }
            });
            setTimeout(() => {
                if (!resolved) {
                    resolved = true;
                    unsubscribe();
                    firebaseAuth.currentUser?.reload().catch(() => {});
                    resolve(firebaseAuth.currentUser || null);
                }
            }, maxWait);
        });
    }

    // ========== CHECK LOGIN ==========
    async function checkLogin() {
        logStep('🔐', '==================== CHECKLOGIN MULAI ====================');
        const loggedInUser = localStorage.getItem('jego_logged_in_user');
        logStep('🔐', `[checkLogin] jeho_logged_in_user ada? ${loggedInUser ? '✅ YA' : '❌ TIDAK'}`);

        // Jika belum login → langsung redirect ke loginuser.html
        if (!loggedInUser) {
            redirectToLogin();
            return false;
        }

        try {
            currentUser = JSON.parse(loggedInUser);
            logStep('🔐', `[checkLogin] currentUser uid: ${currentUser?.uid || 'NULL'}`);

            if (!currentUser || !currentUser.uid) {
                logStep('🔐', '[checkLogin] ❌ uid tidak valid, redirect');
                redirectToLogin();
                return false;
            }

            document.getElementById('mainContent').style.display = 'block';

            // Tampilkan saldo JePay
            await loadWalletBalance(currentUser.uid);

            // Sembunyikan / tampilkan foto profile alert
            if (!currentUser.photoURL || currentUser.photoURL === '') {
                const photoAlert = document.getElementById('photoProfileAlert');
                if (photoAlert) {
                    photoAlert.style.display = 'block';
                    const closeBtn = document.getElementById('closePhotoAlert');
                    if (closeBtn) {
                        closeBtn.onclick = () => {
                            photoAlert.style.display = 'none';
                        };
                    }
                }
            } else {
                const photoAlert = document.getElementById('photoProfileAlert');
                if (photoAlert) photoAlert.style.display = 'none';
            }

            const appBarRight = document.getElementById('appBarRight');
            const darkModeBtn = document.getElementById('darkModeToggle');
            appBarRight.innerHTML = '';
            if (darkModeBtn) appBarRight.appendChild(darkModeBtn);
            const badge = document.createElement('div');
            badge.className = 'profile-badge';
            badge.innerHTML = `<div class="avatar">${escapeHtml((currentUser.name || 'U').charAt(0).toUpperCase())}</div><span>${escapeHtml((currentUser.name || 'User').split(' ')[0])}</span>`;
            appBarRight.appendChild(badge);
            logStep('🔐', '[checkLogin] profile badge ditampilkan');

            logStep('🔐', '[checkLogin] memanggil initializeFirebase...');
            const firebaseReady = await initializeFirebase();
            logStep('🔐', `[checkLogin] initializeFirebase hasil: ${firebaseReady}`);

            if (!firebaseReady) {
                showAlert('❌ Gagal koneksi Firebase', 'error');
                return false;
            }
            let firebaseUser = await waitForFirebaseAuth(10000);
            logStep('🔐', `[checkLogin] firebaseUser: ${firebaseUser?.uid || 'NULL'}`);

            if (!firebaseUser) {
                console.warn('Firebase user still null, trying to force refresh...');
                try {
                    await firebaseAuth.currentUser?.reload();
                    firebaseUser = firebaseAuth.currentUser;
                } catch(e) {}
            }
            if (!firebaseUser) {
                showAlert('⚠️ Sesi tidak valid, silakan login ulang', 'error');
                setTimeout(() => redirectToLogin(), 2000);
                return false;
            }
            if (firebaseUser.uid !== currentUser.uid) {
                await firebaseAuth.signOut();
                localStorage.removeItem('jego_logged_in_user');
                redirectToLogin();
                return false;
            }
            const orderAktif = await cekOrderAktifDanRedirect();
            if (orderAktif) return true;

            logStep('🔐', '[checkLogin] memanggil fetchTransportData...');
            await fetchTransportData();

            logStep('🔐', '[checkLogin] memanggil loadBanner...');
            await loadBanner();

            const requiredFields = ['name', 'phone', 'address'];
            const missingFields = requiredFields.filter(field => !currentUser[field] || currentUser[field].trim() === '');
            if (missingFields.length > 0) {
                showAlert(`⚠️ Lengkapi data profil Anda (${missingFields.join(', ')}) sebelum memesan.`, 'error');
                setTimeout(() => {
                    openEditProfileModal();
                }, 1000);
                return false;
            }

            uiLog('✅ User berhasil login', 'info');
            logStep('🔐', '==================== CHECKLOGIN SELESAI ✅ ====================');
            return true;
        } catch (error) {
            console.error('❌ [checkLogin] ERROR:', error);
            redirectToLogin();
            return false;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // ========== FETCH DATA KENDARAAN ==========
    async function fetchTransportData() {
        logStep('📦', '==================== FETCHTRANSPORTDATA MULAI ====================');
        try {
            logStep('📦', `[fetchTransportData] firebaseDatabase: ${firebaseDatabase ? '✅ OK' : '❌ NULL'}`);
            if (!firebaseDatabase) throw new Error('firebaseDatabase masih null');

            showLoading(true);
            logStep('📦', '[fetchTransportData] showLoading(true)');

            logStep('📦', '[fetchTransportData] ambil data-jego/tarif dari Firebase...');
            const snapshot = await firebaseDatabase.ref('data-jego/tarif').once('value');
            const firebaseData = snapshot.val();

            logStep('📦', '[fetchTransportData] data dari Firebase:', firebaseData);

            if (!firebaseData) throw new Error('data-jego/tarif KOSONG di Firebase');

            transportData = {};
            tariffRates = {};
            let countMapped = 0;
            let countSkipped = 0;

            snapshot.forEach((child) => {
                const data = child.val();
                const transportName = data.nama;
                const internalName = transportNameMapping[transportName];

                if (internalName && data) {
                    transportData[internalName] = {
                        name: data.nama,
                        capacity: data.capacity || "Kapasitas standar",
                        description: data.deskripsi || "Layanan terbaik JeGo",
                        icon: data.icon_url || "https://cdn-icons-png.flaticon.com/128/7890/7890227.png",
                        minimalDistance: data.minimal_distance || 4,
                        minimalPrice: data.minimal_price || 10000
                    };
                    tariffRates[internalName] = data.price_per_km || 2000;
                    countMapped++;
                    logStep('📦', `  ✅ mapping: "${transportName}" → "${internalName}"`);
                } else {
                    countSkipped++;
                    logStep('📦', `  ⏭️ skip: "${transportName}" (tidak ada di transportNameMapping)`);
                }
            });

            logStep('📦', `[fetchTransportData] Total mapped: ${countMapped}, skipped: ${countSkipped}`);
            logStep('📦', '[fetchTransportData] transportData final:', transportData);

            if (countMapped === 0) {
                throw new Error('Tidak ada kendaraan yang berhasil di-mapping dari Firebase');
            }

            logStep('📦', '[fetchTransportData] panggil renderTransportCards()...');
            renderTransportCards();
            showLoading(false);
            logStep('📦', '==================== FETCHTRANSPORTDATA SUKSES ✅ ====================');
        } catch (error) {
            console.error('❌ [fetchTransportData] ERROR:', error);
            logStep('📦', `[fetchTransportData] fallback ke loadFallbackData...`);
            showLoading(false);
            loadFallbackData();
            showAlert('Menggunakan data lokal, koneksi ke server terganggu: ' + error.message, 'error');
        }
    }

    // ========== RENDER KENDARAAN GRID ==========
    function renderTransportCards() {
        logStep('🎨', '==================== RENDERTRANSPORTCARDS MULAI ====================');
        const topGrid = document.getElementById('transportGridTop');
        const bottomGrid = document.getElementById('transportGridBottom');

        logStep('🎨', `[renderTransportCards] topGrid: ${topGrid ? '✅ DITEMUKAN' : '❌ NULL'}`);
        logStep('🎨', `[renderTransportCards] bottomGrid: ${bottomGrid ? '✅ DITEMUKAN' : '❌ NULL'}`);

        if (!topGrid || !bottomGrid) {
            console.error('❌ [renderTransportCards] Elemen grid TIDAK DITEMUKAN di HTML!');
            return;
        }

        topGrid.innerHTML = '';
        bottomGrid.innerHTML = '';

        const topOrder = ['motor', 'bentor'];
        const bottomOrder = ['mobil', 'kurir_motor', 'kurir_bentor'];

        logStep('🎨', `[renderTransportCards] transportData keys: [${Object.keys(transportData).join(', ')}]`);

        function createCard(type, t) {
            const card = document.createElement('div');
            card.className = 'transport-card';
            card.innerHTML = `
                <div class="transport-icon"><img src="${t.icon}" alt="${t.name}" loading="lazy"></div>
                <div class="transport-info">
                    <div class="transport-name">${t.name}</div>
                    <div class="transport-capacity">${t.capacity}</div>
                    <div class="transport-description">${t.description}</div>
                </div>
            `;
            card.addEventListener('click', () => selectTransport(type, t, card));
            return card;
        }

        let countTop = 0, countBottom = 0;

        topOrder.forEach(type => {
            const t = transportData[type];
            if (t) {
                topGrid.appendChild(createCard(type, t));
                countTop++;
                logStep('🎨', `  ✅ render TOP: ${type} → ${t.name}`);
            } else {
                logStep('🎨', `  ❌ TIDAK ADA di transportData: ${type}`);
            }
        });

        bottomOrder.forEach(type => {
            const t = transportData[type];
            if (t) {
                bottomGrid.appendChild(createCard(type, t));
                countBottom++;
                logStep('🎨', `  ✅ render BOTTOM: ${type} → ${t.name}`);
            } else {
                logStep('🎨', `  ❌ TIDAK ADA di transportData: ${type}`);
            }
        });

        logStep('🎨', `[renderTransportCards] ✅ Rendered ${countTop + countBottom} cards (top: ${countTop}, bottom: ${countBottom})`);

        if (countTop + countBottom === 0) {
            // Tampilkan pesan "kosong" kalau tidak ada data sama sekali
            topGrid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; color: var(--text-secondary);">
                    <div style="font-size: 48px; margin-bottom: 12px;">🚫</div>
                    <div style="font-weight: 600; margin-bottom: 6px;">Tidak ada kendaraan tersedia</div>
                    <div style="font-size: 0.8rem;">Data dari Firebase tidak ditemukan. Hubungi admin.</div>
                </div>
            `;
        }

        logStep('🎨', '==================== RENDERTRANSPORTCARDS SELESAI ====================');
    }

    // ========== PILIH KENDARAAN ==========
    function selectTransport(type, t, card) {
        logStep('🚗', `[selectTransport] dipilih: ${type} - ${t.name}`);
        if (isProcessing) {
            logStep('🚗', '[selectTransport] ⏭️ isProcessing=true, skip');
            return;
        }
        showGlobalLoading(true);
        isProcessing = true;
        document.querySelectorAll('.transport-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedTransport = {
            type: type,
            name: t.name,
            capacity: t.capacity,
            icon: t.icon,
            description: t.description,
            tariff: tariffRates[type],
            minimalDistance: t.minimalDistance,
            minimalPrice: t.minimalPrice
        };
        logStep('🚗', '[selectTransport] selectedTransport:', selectedTransport);

        if (type === 'kurir_motor' || type === 'kurir_bentor') {
            showGlobalLoading(false);
            isProcessing = false;
            showKurirChoiceModal();
        } else {
            setTimeout(() => processTransportSelection(selectedTransport, 'rute.html'), 600);
        }
    }

    // ========== MODAL KURIR ==========
    function showKurirChoiceModal() {
        logStep('📦', '[showKurirChoiceModal] tampilkan modal kurir');
        document.getElementById('kurirChoiceModal').classList.add('active');
    }

    function closeKurirChoiceModal() {
        logStep('📦', '[closeKurirChoiceModal] tutup modal kurir');
        document.getElementById('kurirChoiceModal').classList.remove('active');
        selectedTransport = null;
        document.querySelectorAll('.transport-card').forEach(c => c.classList.remove('selected'));
        isProcessing = false;
    }

    document.getElementById('chooseKurir').addEventListener('click', () => {
        if (selectedTransport) {
            document.getElementById('kurirChoiceModal').classList.remove('active');
            showGlobalLoading(true);
            setTimeout(() => processTransportSelection(selectedTransport, 'rute_kurir.html'), 400);
        }
    });

    document.getElementById('closeChoiceModal').addEventListener('click', closeKurirChoiceModal);
    document.getElementById('kurirChoiceModal').addEventListener('click', function(e) {
        if (e.target === this) closeKurirChoiceModal();
    });

    function processTransportSelection(transport, targetPage) {
        logStep('➡️', `[processTransportSelection] pindah ke ${targetPage}`);
        localStorage.setItem('jego_last_transport', JSON.stringify(transport));
        window.location.href = targetPage;
    }

    // ========== LOADING ==========
    function showLoading(show) {
        const spinner = document.getElementById('loadingSpinner');
        const topGrid = document.getElementById('transportGridTop');
        const bottomGrid = document.getElementById('transportGridBottom');
        if (spinner) spinner.style.display = show ? 'flex' : 'none';
        if (topGrid) topGrid.style.display = show ? 'none' : 'grid';
        if (bottomGrid) bottomGrid.style.display = show ? 'none' : 'grid';
    }

    function showGlobalLoading(show) {
        document.getElementById('globalLoading').style.display = show ? 'flex' : 'none';
    }

    function showAlert(message, type) {
        const alertDiv = type === 'error' ? document.getElementById('errorAlert') : document.getElementById('successAlert');
        if (alertDiv) {
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            setTimeout(() => alertDiv.style.display = 'none', 3500);
        }
    }

    // ========== LOG UI ==========
    function toggleLog() {
        const container = document.getElementById('logContainer');
        container.style.display = container.style.display === 'none' ? 'block' : 'none';
    }

    function uiLog(message, type = 'info') {
        const logContent = document.getElementById('logContent');
        const colors = {
            info: '#0f0',
            success: '#0f0',
            error: '#f44',
            warning: '#ff0'
        };
        const entry = document.createElement('div');
        entry.style.color = colors[type] || '#fff';
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logContent.appendChild(entry);
        logContent.scrollTop = logContent.scrollHeight;
        const container = document.getElementById('logContainer');
        if (container.style.display === 'none') {
            container.style.display = 'block';
        }
        console.log(message);
    }

    // ========== EDIT PROFIL (placeholder) ==========
    function openEditProfileModal() {
        showCustomPopup('Lengkapi Data', 'Silakan perbarui profil Anda di menu Akun.', 'warning', '⚠️');
    }

    // ========== UPDATE FCM TOKEN ==========
    function updateFCMToken(token) {
        uiLog('📩 FCM Token diterima dari Android', 'info');
        uiLog('Token: ' + token.substring(0, 20) + '...', 'info');
        if (currentUser && currentUser.uid) {
            firebaseDatabase.ref(`users/${currentUser.uid}/fcmTokens`).push(token)
                .then(() => {
                    uiLog('✅ Token FCM berhasil disimpan di database!', 'success');
                })
                .catch(err => {
                    uiLog('❌ Gagal simpan token: ' + err.message, 'error');
                });
        } else {
            uiLog('⚠️ User belum login, token tidak disimpan.', 'warning');
        }
    }

    // ==================== INIT ====================
    window.onload = async () => {
        logStep('🚀', '============================================================');
        logStep('🚀', '==================== WINDOW ONLOAD ====================');
        logStep('🚀', '============================================================');

        // Cek elemen penting
        logStep('🚀', `[DOM] transportGridTop: ${document.getElementById('transportGridTop') ? '✅' : '❌'}`);
        logStep('🚀', `[DOM] transportGridBottom: ${document.getElementById('transportGridBottom') ? '✅' : '❌'}`);
        logStep('🚀', `[DOM] loadingSpinner: ${document.getElementById('loadingSpinner') ? '✅' : '❌'}`);
        logStep('🚀', `[DOM] mainContent: ${document.getElementById('mainContent') ? '✅' : '❌'}`);

        // Event listener top up
        const topupBtn = document.getElementById('topupNowBtn');
        if (topupBtn) topupBtn.addEventListener('click', goToTopUp);

        const balanceCard = document.getElementById('balanceCard');
        if (balanceCard) {
            balanceCard.addEventListener('click', function(e) {
                if (!e.target.closest('#topupNowBtn')) {
                    goToTopUp();
                }
            });
        }

        logStep('🚀', '[INIT] memanggil checkLogin()...');
        await checkLogin();

        logStep('🚀', '[INIT] memanggil setupBottomNav()...');
        setupBottomNav();

        logStep('🚀', '[INIT] memanggil setupSidebarActions()...');
        setupSidebarActions();

        logStep('🚀', '[INIT] memanggil initDarkMode()...');
        initDarkMode();

        logStep('🚀', '==================== INIT SELESAI ====================');
    };
</script>
