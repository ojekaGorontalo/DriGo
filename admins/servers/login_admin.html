<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Login Admin — JeGo Core</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0a0f1e 0%, #1a2332 100%);
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #0f1724;
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    border: 1px solid #2d3a4e;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 2.5rem;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    color: #FF9800;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    text-align: center;
    color: #5b6e8c;
    font-size: 0.85rem;
    margin-bottom: 32px;
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: #94a3b8;
    margin-bottom: 6px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    background: #0a0f1e;
    border: 1.5px solid #2d3a4e;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 0.95rem;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  input:focus {
    outline: none;
    border-color: #FF9800;
  }
  input::placeholder { color: #4a5568; }
  .pass-wrap {
    position: relative;
  }
  .pass-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px;
  }
  .pass-toggle:hover { color: #FF9800; }
  button.login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
    border: none;
    border-radius: 10px;
    color: #0a0f1e;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.1s, box-shadow 0.2s;
    letter-spacing: 0.5px;
  }
  button.login-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(255,152,0,0.3);
  }
  button.login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .msg {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    text-align: center;
    display: none;
    line-height: 1.4;
  }
  .msg.error   { background: #3b1c1c; color: #fca5a5; border: 1px solid #7f1d1d; display: block; }
  .msg.success { background: #14311c; color: #86efac; border: 1px solid #166534; display: block; }
  .msg.info    { background: #1c2840; color: #93c5fd; border: 1px solid #1e3a8a; display: block; }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #94a3b8;
    margin-top: 4px;
    cursor: pointer;
  }
  .remember input { width: auto; }
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.75rem;
    color: #4a5568;
  }
  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #0a0f1e;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">⚡</div>
  <h1>JeGo Core Admin</h1>
  <div class="subtitle">Login untuk mengakses sistem</div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="email">Email Admin</label>
      <input type="email" id="email" placeholder="admin@jego.com" autocomplete="username" required />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pass-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        <button type="button" class="pass-toggle" id="togglePass" title="Lihat password">👁</button>
      </div>
    </div>

    <label class="remember">
      <input type="checkbox" id="remember" checked />
      Ingat saya di perangkat ini
    </label>

    <button type="submit" class="login-btn" id="btnLogin">Masuk</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="footer">JEGO System Core v1.0</div>
</div>

<script>
// ==================== FIREBASE CONFIG ====================
const firebaseConfig = {
  apiKey: "AIzaSyCD0pgeZio-LdKqYDtWxcdXcZwyL4ngYQI",
  authDomain: "jego-35a2b.firebaseapp.com",
  databaseURL: "https://jego-35a2b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jego-35a2b",
  storageBucket: "jego-35a2b.firebasestorage.app",
  messagingSenderId: "600037007040",
  appId: "1:600037007040:web:ac3243ad9b472647ffd725"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const database = firebase.database();

// ==================== UI ====================
const $ = (id) => document.getElementById(id);
const msgEl = $('msg');

function showMsg(text, type = 'info') {
  msgEl.textContent = text;
  msgEl.className = 'msg ' + type;
}
function clearMsg() {
  msgEl.textContent = '';
  msgEl.className = 'msg';
}

// toggle password
$('togglePass').addEventListener('click', () => {
  const p = $('password');
  if (p.type === 'password') {
    p.type = 'text';
    $('togglePass').textContent = '🙈';
  } else {
    p.type = 'password';
    $('togglePass').textContent = '👁';
  }
});

// ==================== PERSISTENCE ====================
// Cek preferensi "ingat saya" terakhir
const savedRemember = localStorage.getItem('jego_admin_remember');
if (savedRemember === '0') {
  $('remember').checked = false;
}

// ==================== LOGIN HANDLER ====================
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMsg();

  const email    = $('email').value.trim();
  const password = $('password').value;
  const remember = $('remember').checked;

  if (!email || !password) {
    showMsg('❌ Email dan password wajib diisi', 'error');
    return;
  }

  const btn = $('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Memverifikasi...';

  try {
    // Set persistence dulu (LOCAL = tetap login, SESSION = logout saat tab ditutup)
    const persistence = remember
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;
    await auth.setPersistence(persistence);

    // Login
    const userCred = await auth.signInWithEmailAndPassword(email, password);
    const user = userCred.user;

    showMsg('🔍 Memeriksa akses admin...', 'info');

    // Cek apakah user ini ada di node admins/{uid}
    const adminSnap = await database.ref(`admins/${user.uid}`).once('value');

    if (!adminSnap.exists()) {
      showMsg('❌ Akun ini bukan admin. Hubungi administrator.', 'error');
      await auth.signOut();
      btn.disabled = false;
      btn.textContent = 'Masuk';
      return;
    }

    // (opsional) simpan remember preference
    localStorage.setItem('jego_admin_remember', remember ? '1' : '0');

    showMsg('✅ Login berhasil! Mengalihkan...', 'success');

    // Redirect ke core system
    setTimeout(() => {
      window.location.href = 'jego_system24.html';
    }, 700);

  } catch (err) {
    console.error('Login error:', err);
    const code = err.code || '';
    let pesan = err.message || 'Login gagal';

    const map = {
      'auth/invalid-email':            'Format email tidak valid',
      'auth/user-disabled':            'Akun dinonaktifkan',
      'auth/user-not-found':           'Email tidak terdaftar',
      'auth/wrong-password':           'Password salah',
      'auth/invalid-credential':       'Email atau password salah',
      'auth/invalid-login-credentials':'Email atau password salah',
      'auth/too-many-requests':        'Terlalu banyak percobaan. Coba lagi nanti',
      'auth/network-request-failed':   'Gagal terhubung. Cek koneksi internet',
      'auth/operation-not-allowed':    'Login email/password belum diaktifkan di Firebase',
    };
    if (map[code]) pesan = map[code];

    showMsg('❌ ' + pesan, 'error');
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
});

// ==================== AUTO-REDIRECT KALAU SUDAH LOGIN ====================
// Kalau user sudah login (session Firebase masih aktif) DAN admin, langsung masuk
auth.onAuthStateChanged(async (user) => {
  if (!user) return;   // belum login, biarkan form
  try {
    const adminSnap = await database.ref(`admins/${user.uid}`).once('value');
    if (adminSnap.exists()) {
      showMsg('✅ Sudah login sebagai admin. Mengalihkan...', 'success');
      setTimeout(() => {
        window.location.href = 'jego_system24.html';
      }, 500);
    } else {
      // login tapi bukan admin → logout
      await auth.signOut();
    }
  } catch (e) {
    // biarkan form login
  }
});

// Enter di password → submit
$('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('loginForm').requestSubmit();
});
</script>
</body>
</html>
